
spring:
  application:
    name: travel-ideas-ai

  datasource:
    url: jdbc:h2:mem:travelideas
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: false

app:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.2:3b}
      connect-timeout: 5s
      read-timeout: 180s

  geocoding:
    nominatim:
      base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
      user-agent: "${NOMINATIM_USER_AGENT:TravelIdeasAI/1.0 (https://github.com/nhordiienko23/travel-ideas-ai)}"
      connect-timeout: 2s
      read-timeout: 3s
